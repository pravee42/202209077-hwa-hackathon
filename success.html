<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Confirmed — TrailVault™</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="bg-ice-cyan-50 text-charcoal font-sans antialiased">

  <nav class="fixed top-0 left-0 right-0 z-50 bg-white/80 backdrop-blur-md border-b border-ice-cyan-100">
    <div class="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between">
      <div class="flex items-center gap-2 cursor-pointer" onclick="location.href='/'">
        <div class="w-8 h-8 rounded-full bg-deep-teal flex items-center justify-center text-white font-bold text-xs">T</div>
        <span class="font-bold text-xl tracking-tight text-charcoal">TrailVault</span>
      </div>
    </div>
  </nav>

  <main class="max-w-2xl mx-auto px-6 py-24 text-center">
    <div class="w-16 h-16 rounded-full bg-green-100 flex items-center justify-center mx-auto mb-6 text-green-600 font-bold text-2xl">✓</div>
    <h1 class="text-3xl md:text-4xl font-bold text-charcoal mb-4">Order confirmed</h1>
    <p class="text-charcoal-600 mb-8">Thank you! Your TrailVault order has been placed.</p>
    <div class="bg-white rounded-2xl p-8 border border-ice-cyan-200 inline-block mb-10">
      <p class="text-sm text-charcoal-400 mb-2">Order ID</p>
      <p id="orderId" class="font-bold text-deep-teal text-lg">—</p>
    </div>
    <p class="text-charcoal-600 mb-10">We've captured your shipping address and will send a confirmation email shortly.</p>
    <a href="/" class="px-8 py-3 bg-deep-teal text-white font-semibold rounded-full hover:bg-deep-teal/90 transition">Continue shopping</a>
  </main>

  <script>
    const url = new URL(window.location.href);
    const id = url.searchParams.get('id');
    document.getElementById('orderId').textContent = id || 'TV-' + Date.now();
  </script>
</body>
</html>
