<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout — TrailVault™</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="bg-ice-cyan-50 text-charcoal font-sans antialiased">

  <nav class="fixed top-0 left-0 right-0 z-50 bg-white/80 backdrop-blur-md border-b border-ice-cyan-100">
    <div class="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between">
      <div class="flex items-center gap-2 cursor-pointer" onclick="location.href='/'">
        <div class="w-8 h-8 rounded-full bg-deep-teal flex items-center justify-center text-white font-bold text-xs">T</div>
        <span class="font-bold text-xl tracking-tight text-charcoal">TrailVault</span>
      </div>
      <a href="/" class="text-deep-teal font-medium text-sm hover:underline">← Back to shop</a>
    </div>
  </nav>

  <main class="max-w-5xl mx-auto px-6 py-24">
    <div class="grid md:grid-cols-1 lg:grid-cols-2 gap-12">
      <!-- Order Summary -->
      <div class="lg:col-span-1 space-y-6">
        <h2 class="text-2xl font-bold text-charcoal">Order Summary</h2>
        <div id="checkoutSummary" class="bg-white rounded-2xl p-6 border border-ice-cyan-200 shadow-sm space-y-4">
          <!-- injected -->
        </div>
        <div class="bg-white rounded-2xl p-6 border border-ice-cyan-200 shadow-sm">
          <div class="flex justify-between mb-4">
            <span class="text-charcoal-600">Subtotal</span>
            <span id="checkoutSubtotal" class="font-semibold text-charcoal">$0.00</span>
          </div>
          <div class="flex justify-between mb-2">
            <span class="text-charcoal-400 text-sm">Shipping</span>
            <span class="text-green-600 text-sm font-medium">Free</span>
          </div>
          <div class="flex justify-between pt-4 border-t border-ice-cyan-100">
            <span class="font-bold text-charcoal">Total</span>
            <span id="checkoutTotal" class="font-bold text-deep-teal text-lg">$0.00</span>
          </div>
        </div>
        <p class="text-xs text-charcoal-400">Taxes calculated at checkout. Shipping calculated at checkout.</p>
      </div>

      <!-- Checkout Form -->
      <div class="bg-white rounded-3xl p-8 md:p-12 border border-ice-cyan-200 shadow-sm">
        <h2 class="text-2xl font-bold text-charcoal mb-8">Shipping &amp; Payment</h2>
        <form id="checkoutForm" class="space-y-6">
          <div class="grid md:grid-cols-2 gap-6">
            <div class="space-y-2">
              <label class="block text-sm font-medium text-charcoal-700">Full Name</label>
              <input type="text" name="name" required class="w-full px-4 py-3 rounded-xl border border-ice-cyan-200 focus:ring-2 focus:ring-deep-teal focus:border-transparent outline-none transition">
            </div>
            <div class="space-y-2">
              <label class="block text-sm font-medium text-charcoal-700">Email</label>
              <input type="email" name="email" required class="w-full px-4 py-3 rounded-xl border border-ice-cyan-200 focus:ring-2 focus:ring-deep-teal focus:border-transparent outline-none transition">
            </div>
          </div>
          <div class="space-y-2">
            <label class="block text-sm font-medium text-charcoal-700">Street Address</label>
            <input type="text" name="address" required class="w-full px-4 py-3 rounded-xl border border-ice-cyan-200 focus:ring-2 focus:ring-deep-teal focus:border-transparent outline-none transition">
          </div>
          <div class="grid md:grid-cols-3 gap-6">
            <div class="space-y-2">
              <label class="block text-sm font-medium text-charcoal-700">City</label>
              <input type="text" name="city" required class="w-full px-4 py-3 rounded-xl border border-ice-cyan-200 focus:ring-2 focus:ring-deep-teal focus:border-transparent outline-none transition">
            </div>
            <div class="space-y-2">
              <label class="block text-sm font-medium text-charcoal-700">State</label>
              <input type="text" name="state" required class="w-full px-4 py-3 rounded-xl border border-ice-cyan-200 focus:ring-2 focus:ring-deep-teal focus:border-transparent outline-none transition">
            </div>
            <div class="space-y-2">
              <label class="block text-sm font-medium text-charcoal-700">ZIP</label>
              <input type="text" name="zip" required class="w-full px-4 py-3 rounded-xl border border-ice-cyan-200 focus:ring-2 focus:ring-deep-teal focus:border-transparent outline-none transition">
            </div>
          </div>
          <div class="space-y-2">
            <label class="block text-sm font-medium text-charcoal-700">Country</label>
            <input type="text" name="country" value="United States" required class="w-full px-4 py-3 rounded-xl border border-ice-cyan-200 focus:ring-2 focus:ring-deep-teal focus:border-transparent outline-none transition">
          </div>
          <div class="pt-4 border-t border-ice-cyan-100">
            <div class="flex justify-between mb-4 text-sm">
              <span class="text-charcoal-600">Order total</span>
              <span class="font-bold text-charcoal" id="formTotal">$0.00</span>
            </div>
            <button type="submit" class="w-full py-5 bg-deep-teal text-white font-bold text-lg rounded-xl shadow-lg hover:bg-deep-teal/90 transition flex items-center justify-center gap-2">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
              Place Order — $69
            </button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <footer class="py-12 px-6 border-t border-ice-cyan-100 bg-white mt-auto">
    <div class="max-w-5xl mx-auto flex flex-col md:flex-row justify-between items-center gap-6">
      <div class="flex items-center gap-2">
        <div class="w-6 h-6 rounded-full bg-deep-teal flex items-center justify-center text-white text-xs font-bold">T</div>
        <span class="font-bold text-charcoal">TrailVault</span>
      </div>
      <p class="text-charcoal-400 text-sm">3 hours alone. One system. A tired dog.</p>
    </div>
  </footer>

  <script src="/app.js"></script>
  <script>
    // Checkout page init
    document.addEventListener('DOMContentLoaded', () => {
      const cart = JSON.parse(localStorage.getItem('tv_cart') || '[]');
      const summary = document.getElementById('checkoutSummary');
      const subtotalEl = document.getElementById('checkoutSubtotal');
      const totalEl = document.getElementById('checkoutTotal');
      const formTotal = document.getElementById('formTotal');

      let subtotal = 0;
      summary.innerHTML = '';
      cart.forEach(item => {
        subtotal += item.price * item.qty;
        const div = document.createElement('div');
        div.className = 'flex items-center gap-4 border-b border-ice-cyan-100 pb-3';
        div.innerHTML = `
          <img src="${item.image}" class="w-12 h-12 rounded-lg object-cover">
          <div class="flex-1">
            <div class="font-semibold text-charcoal">${item.name}</div>
            <div class="text-sm text-charcoal-500">Qty ${item.qty} × $${(item.price/100).toFixed(2)}</div>
          </div>
          <span class="font-semibold text-charcoal">$${(item.price * item.qty / 100).toFixed(2)}</span>
        `;
        summary.appendChild(div);
      });
      const total = subtotal;
      subtotalEl.textContent = `$${(subtotal/100).toFixed(2)}`;
      totalEl.textContent = `$${(total/100).toFixed(2)}`;
      formTotal.textContent = `$${(total/100).toFixed(2)}`;

      document.getElementById('checkoutForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = e.target.querySelector('button[type="submit"]');
        const original = btn.innerHTML;
        btn.innerHTML = 'Processing…';
        btn.disabled = true;

        const formData = new FormData(e.target);
        const order = {
          items: cart,
          subtotal,
          total,
          name: formData.get('name'),
          email: formData.get('email'),
          address: formData.get('address'),
          city: formData.get('city'),
          state: formData.get('state'),
          zip: formData.get('zip'),
          country: formData.get('country')
        };

        try {
          const res = await fetch('/api/order', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(order)
          });
          const data = await res.json();
          if (data.success) {
            localStorage.removeItem('tv_cart');
            window.location.href = `/success.html?id=${data.orderId}`;
          } else {
            throw new Error(data.message);
          }
        } catch (err) {
          btn.innerHTML = original;
          btn.disabled = false;
          alert('Order failed. Please try again.');
        }
      });
    });
  </script>
</body>
</html>
